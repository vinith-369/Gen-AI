<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airys</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <!-- Collapse Button -->
            <button class="collapse-btn" onclick="toggleSidebar()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

            <!-- Collapsed Controls -->
            <div class="collapsed-controls">
                <button class="collapsed-new-chat" onclick="startNewChat()">
                    +
                </button>
            </div>

            <!-- Regular Sidebar Content -->
            <div class="sidebar-content">
                <button class="new-chat-btn" onclick="startNewChat()">
                    <span>+</span>
                    New chat
                </button>

                <div class="chat-history">
                    <div class="chat-history-item">Previous conversation 1</div>
                    <div class="chat-history-item">Previous conversation 2</div>
                    <div class="chat-history-item">Previous conversation 3</div>
                </div>

                <div class="user-profile" onclick="toggleProfileMenu()">
                    <div class="user-avatar">U</div>
                    <div class="user-info">
                        <div class="user-name">User</div>
                        <div class="user-plan">Free plan</div>
                    </div>
                    <svg class="profile-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                
                <!-- Profile Dropdown Menu -->
                <div class="profile-menu" id="profileMenu">
                    <div class="profile-menu-header">
                        <div class="profile-menu-avatar">U</div>
                        <div>
                            <div class="profile-menu-name">User</div>
                            <div class="profile-menu-email">user@example.com</div>
                        </div>
                    </div>
                    <div class="profile-menu-divider"></div>
                    <div class="profile-menu-item" onclick="openSettings()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                            <path d="M12 1v6m0 6v6M23 12h-6m-6 0H1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        Settings
                    </div>
                    <div class="profile-menu-item" onclick="viewProfile()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        My Profile
                    </div>
                    <div class="profile-menu-item" onclick="upgradePlan()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Upgrade to Pro
                    </div>
                    <div class="profile-menu-divider"></div>
                    <div class="profile-menu-item" onclick="logout()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <polyline points="16 17 21 12 16 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Log out
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Floating Logo -->
            <div class="floating-logo">
                <span>Airys <span class="ai-accent">AI</span></span>
            </div>

            <!-- Copy Notification -->
            <div class="copy-notification" id="copyNotification">
                Copied to clipboard!
            </div>

            <div class="chat-container">
                <div class="messages-container" id="messagesContainer">
                    <!-- Welcome Screen -->
                    <div class="welcome-screen" id="welcomeScreen">
                        <div class="welcome-greeting">
                            Hello! How can I help you today?
                        </div>
                        <div class="quick-actions">
                            <button class="quick-action" onclick="sendQuickMessage('Help me with math')">Math Help</button>
                            <button class="quick-action" onclick="sendQuickMessage('Tell me a joke')">Entertainment</button>
                            <button class="quick-action" onclick="sendQuickMessage('Explain quantum physics')">Learn</button>
                            <button class="quick-action" onclick="sendQuickMessage('Plan my day')">Life stuff</button>
                        </div>
                    </div>
                </div>

                <!-- Input Area -->
                <div class="input-container">
                    <div class="input-wrapper">
                        <textarea
                            id="messageInput"
                            class="input-box"
                            placeholder="Ask Airys anything..."
                            rows="1"
                            onkeydown="handleKeyPress(event)"
                            oninput="autoResize(this)"
                        ></textarea>
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M2 12L22 2L18 12L22 22L2 12Z" fill="currentColor"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script src="script.js"></script>
</body>
</html>
